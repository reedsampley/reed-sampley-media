[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"

# Unlisted wedding page — no search indexing
[[headers]]
  for = "/weddings/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/weddings"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Unlisted flyer page — no search indexing
[[headers]]
  for = "/flyer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/flyer"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Old URL → clean path
[[redirects]]
  from = "/wedding.html"
  to = "/weddings"
  status = 301
  force = true

[[redirects]]
  from = "/flyers"
  to = "/flyer"
  status = 301
  force = true

[[redirects]]
  from = "/flyers/*"
  to = "/flyer/:splat"
  status = 301
  force = true

# Unlisted 360 tours page — no search indexing
[[headers]]
  for = "/360tours/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/360tours"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Unlisted /link page — no search indexing, not in main navigation
[[headers]]
  for = "/link"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/link/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/link/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
